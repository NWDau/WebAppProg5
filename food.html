<div class = "container">
  <div class="col-md-2">D</div>
  <div class="col-md-2">M</div>
  <div class="col-md-2">A</div>
  <div class="col-md-2">Y</div>
  <div class="col-md-2">O</div>
  <div class="col-md-2">M</div>
</div>

<div class = "row">
  <div class="col-md-2">Donuts</div>

<table class="table styled-table">
  <Caption>Food Caption</Caption>
  <thead>
    <tr>

      <th scope="col">Game</th>

    </tr>
  </thead>

<div class="btn-toolbar" role="toolbar" aria-label="Toolbar">
  <div class="btn-group" role="group" aria-label="First letter group">
    <button type ="button" class="btn btn-success">D</button>
    <button type ="button" class="btn btn-success">M</button>
    <button type ="button" class="btn btn-success">A</button>
  </div>  
  <div class="btn-group" role="group" aria-label="Second group">
    <button type ="button" class="btn btn-warning">Y</button>
    <button type ="button" class="btn btn-warning">O</button>
  </div>

  </div>
</div>

    <button type="button" class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
      Success letters
    </button>
    <ul class="dropdown-menu">
      <li><button class="dropdown-item" type="button">D</button></li>

</div>
